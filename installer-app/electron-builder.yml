appId: com.guacamoleinstaller.app
productName: Guacamole Installer
copyright: Copyright © 2025

directories:
  buildResources: build
  output: dist

# Only ship what the app needs.
files:
  - src/**/*
  - "!**/*.map"

# The Docker Compose stack template is bundled and copied to the user's data
# directory on first run. `npm run sync` refreshes ./resources from the repo.
extraResources:
  - from: resources
    to: stack-template
    filter:
      - "**/*"

# ---- macOS ----
mac:
  category: public.app-category.developer-tools
  # One universal DMG (runs on Intel + Apple Silicon) instead of two separate
  # DMGs — avoids the flaky back-to-back `hdiutil detach` failure on GitHub's
  # arm64 runners. The zip is an hdiutil-free fallback so there's always a
  # downloadable macOS build even if DMG creation hiccups on CI.
  target:
    - target: dmg
      arch:
        - universal
    - target: zip
      arch:
        - universal
  icon: build/icon.png
  # No Apple Developer signing by default; users right-click > Open once.
  identity: null
dmg:
  title: ${productName}

# ---- Windows ----
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  icon: build/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Guacamole Installer

# ---- Linux ----
linux:
  category: Utility
  icon: build/icon.png
  target:
    - AppImage
    - deb
    - rpm
  maintainer: catc24 <86363077+catc24@users.noreply.github.com>
  synopsis: One-click installer for Apache Guacamole
